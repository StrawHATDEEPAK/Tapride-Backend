server:
  port: ${PORT:8080}

spring:
  application:
    name: matching-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0   
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# Baseline chaos config - overridable at runtime via PUT /api/chaos.
matching:
  mock:
    failure-rate: 0.10   # ~1 in 10 match requests randomly fail "no drivers available"
  simulation:
    tick-interval-ms: 4000   # how often DriverLocationSimulator advances every active match
  seed:
    center-lat: 22.7196    # Indore, MP - matches the coordinates used in this project's demo/README
    center-lng: 75.8577
    driver-count: 10
    spread-km: 8.0          # drivers seeded randomly within this radius of the center point

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  structured:
    format:
      console: ecs
