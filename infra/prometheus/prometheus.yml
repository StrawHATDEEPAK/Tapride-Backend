global:
  scrape_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8080"]

  - job_name: matching-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["matching-service:8080"]