# kind's default cluster has no way for traffic to reach an Ingress
# controller from outside - this config maps the host's ports 80/443
# straight into the cluster and labels the control-plane node so
# ingress-nginx's kind-specific manifest schedules onto it. This is kind's
# own documented pattern for local Ingress testing, not something invented
# here - see https://kind.sigs.k8s.io/docs/user/ingress/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
