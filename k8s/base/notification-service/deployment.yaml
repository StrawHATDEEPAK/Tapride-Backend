apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tapride
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: tapride/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 320Mi }
            limits: { cpu: 500m, memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: tapride
spec:
  selector: { app: notification-service }
  ports:
    - port: 8080
