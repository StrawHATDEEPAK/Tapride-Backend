apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tapride

resources:
  - namespace.yaml

  - postgres/secret.yaml
  - postgres/order-db.yaml
  - postgres/payment-db.yaml
  - postgres/matching-db.yaml

  - redis/redis.yaml
  - kafka/kafka.yaml

  - order-service/deployment.yaml
  - payment-service/deployment.yaml
  - matching-service/deployment.yaml
  - matching-service/hpa.yaml
  - notification-service/deployment.yaml
  - frontend/deployment.yaml

  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: tapride
