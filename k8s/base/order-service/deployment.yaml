apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: tapride
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: tapride/order-service:latest
          imagePullPolicy: IfNotPresent # overridden per-overlay; IfNotPresent suits a locally-built kind image
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://order-db:5432/order_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: ORDER_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: ORDER_DB_PASSWORD } }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # No Jaeger deployed in this manifest set (kept out of k8s scope
            # deliberately - see k8s/README.md) - disable trace export so logs
            # aren't full of harmless-but-noisy connection-refused errors.
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
          # Real health checks, not placeholders - same /actuator/health this
          # project has used since Day 1 for docker-compose's own healthchecks.
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: tapride
spec:
  selector: { app: order-service }
  ports:
    - port: 8080
