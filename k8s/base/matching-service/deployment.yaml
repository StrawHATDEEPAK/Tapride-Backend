apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: tapride
spec:
  replicas: 1
  selector:
    matchLabels: { app: matching-service }
  template:
    metadata:
      labels: { app: matching-service }
    spec:
      containers:
        - name: matching-service
          image: tapride/matching-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://matching-db:5432/matching_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: MATCHING_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: MATCHING_DB_PASSWORD } }
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.0"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          # Explicit requests are what HPA's CPU-percentage target is
          # calculated AGAINST - without these set, the HPA in hpa.yaml has
          # nothing to compute a percentage of and simply won't work.
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: tapride
spec:
  selector: { app: matching-service }
  ports:
    - port: 8080
