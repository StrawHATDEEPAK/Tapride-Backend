apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tapride
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:latest
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "controller,broker"
            # Single-node KRaft quorum - points at this Pod's own stable
            # headless-service DNS name (StatefulSet Pod 0's identity).
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.tapride.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Advertised via the regular ClusterIP Service name ("kafka") -
            # this is what order-service/payment-service/etc actually connect to.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.tapride.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Headless - gives the StatefulSet Pod its stable DNS identity, used for the
# KRaft controller quorum address above.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: tapride
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - name: plaintext
      port: 9092
    - name: controller
      port: 9093
---
# Regular ClusterIP - what every app service actually connects to
# (bootstrap-servers: kafka:9092).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: tapride
spec:
  selector: { app: kafka }
  ports:
    - port: 9092
